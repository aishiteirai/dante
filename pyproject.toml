[project]
name = "revisor-codigo"
version = "0.1.0"
description = "Harness de revisão de código com o Claude Agent SDK"
requires-python = ">=3.10"
dependencies = ["claude-agent-sdk>=0.2.172"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
revisor = "revisor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["revisor"]
