# Compila o dante para Windows, Linux e macOS.
#
# - Tag "v*" (ex.: git tag v0.5.0 && git push origin v0.5.0): testa, compila e publica uma
#   Release com os binários e o SHA256SUMS.txt. É dela que os scripts de instalação baixam.
# - Rodar à mão (aba Actions → release → Run workflow): só compila e deixa os binários como
#   artefato da execução, sem publicar nada.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # criar a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Testa
        run: go vet ./... && go test ./...

      - name: Compila
        run: scripts/compilar.sh "${GITHUB_REF_NAME}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: dante-${{ github.ref_name }}
          path: dist/

      - name: Publica a Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "dante $GITHUB_REF_NAME" --generate-notes --verify-tag
