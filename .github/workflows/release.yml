# Compila o dante para Windows, Linux e macOS e publica os binários numa Release.
#
# - Tag "v*" (ex.: git tag v0.5.0 && git push origin v0.5.0, ou criando a Release pelo
#   site): testa, compila e anexa os binários e o SHA256SUMS.txt à Release da tag. Se a
#   Release ainda não existe, ela é criada; se já existe (criada pelo site), os arquivos são
#   acrescentados. Tags com "-" (ex.: v0.5.0-alpha) viram pré-release.
# - Rodar à mão (aba Actions → release → Run workflow):
#     * com uma tag no campo "tag": se a tag já existe, compila o código dela e publica na
#       Release dela (serve para refazer uma publicação que falhou); se não existe, compila a
#       branch escolhida em "Use workflow from" e cria a tag e a Release nesse commit;
#     * sem tag: só compila e deixa os binários como artefato da execução.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar, ex.: v0.6.0 (criada na branch escolhida se ainda não existir; vazio = só compilar)"
        required: false
        default: ""

permissions:
  contents: write # criar a Release e anexar os arquivos

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags e histórico, para achar a tag e gerar as notas

      - name: Escolhe o código
        run: |
          if [ -z "$TAG" ]; then exit 0; fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::A tag precisa começar com v e um número (ex.: v0.6.0), não \"$TAG\"."; exit 1 ;;
          esac
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "$TAG"
            echo "Compilando a tag existente $TAG ($(git rev-parse --short HEAD))."
          else
            echo "A tag $TAG não existe: ela será criada no commit $(git rev-parse --short HEAD) de ${GITHUB_REF_NAME}."
          fi
          echo "ALVO=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Testa
        run: go vet ./... && go test ./...

      - name: Compila
        run: scripts/compilar.sh "${TAG:-dev-${GITHUB_SHA::7}}" dist

      - uses: actions/upload-artifact@v5
        with:
          name: dante-${{ env.TAG || github.sha }}
          path: dist/

      - name: Publica na Release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A Release $TAG já existe: anexando os arquivos."
            gh release upload "$TAG" dist/* --clobber
          else
            # Sem a tag, o gh cria a tag no commit compilado (--target).
            gh release create "$TAG" dist/* --title "dante $TAG" --generate-notes --target "$ALVO" $pre
          fi
